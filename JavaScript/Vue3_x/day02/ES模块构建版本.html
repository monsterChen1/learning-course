<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue3-CDN引入</title>
</head>

<body>
    <div id="app">
        {{ message }}<br>
        <button @click="count++">Click me{{ count }}</button><br>
        <button @click="clickHandle">Click me{{ count }}</button><br>
    </div>

    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

        createApp({
            setup() {
                let message = ref('Hello Vue3');
                let count = ref(0);

                const clickHandle = () => {
                    count.value++;
                }

                return {
                    message,
                    count,
                    clickHandle
                }
            }
        }).mount('#app');
    </script>

</body>

</html>
