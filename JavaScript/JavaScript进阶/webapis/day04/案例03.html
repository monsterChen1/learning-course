<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例03</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 3000px;
        }

        .aside {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .item {
            height: 40px;
            line-height: 40px;
            text-align: center;
            padding: 0 10px;
            cursor: pointer;
        }

        .active {
            background-color: red;
            color: #fff;
        }

        .content {
            width: 660px;
            margin: 400px auto;
        }

        .neirong {
            height: 300px;
            margin-bottom: 20px;
            color: #fff;
        }

        .content1 {
            background-color: red;
        }

        .content2 {
            background-color: blue;
        }

        .content3 {
            background-color: orange;
        }

        .content4 {
            background-color: yellowgreen;
        }
    </style>
</head>
<body>
    <div class="aside">
        <div data-index="1" class="item active">男装/女装</div>
        <div data-index="2" class="item">儿童服装/游乐园</div>
        <div data-index="3" class="item">电子产品</div>
        <div data-index="4" class="item">电影/美食</div>
    </div>

    <div class="content">
        <div class="neirong content1">男装/女装</div>
        <div class="neirong content2">儿童服装/游乐园</div>
        <div class="neirong content3">电子产品</div>
        <div class="neirong content4">电影/美食</div>
    </div>

    <script>
        const aside = document.querySelector('.aside');

        aside.addEventListener('click', function(e) {
            if(e.target.classList.contains('item')){
                let activeItem = aside.querySelector('.item.active');
                activeItem.classList.remove('active');
                e.target.classList.add('active');

                let index = e.target.dataset.index;
                let content = document.querySelector(`.content${index}`);
                let contentTop = content.offsetTop;
                document.documentElement.scrollTop = contentTop;
                // window.scrollTo(contentTop);
            }
        });

        window.addEventListener('scroll', function(){
            let scrollTop = document.documentElement.scrollTop;
            // let content1Top = document.querySelector('.content1').offsetTop;
            let content2Top = document.querySelector('.content2').offsetTop;
            let content3Top = document.querySelector('.content3').offsetTop;
            let content4Top = document.querySelector('.content4').offsetTop;

            aside.querySelector('.item.active').classList.remove('active');
            if(scrollTop < content2Top){
                aside.querySelector('.item:nth-child(1)').classList.add('active');
            }else if(scrollTop >= content2Top && scrollTop < content3Top){
                aside.querySelector('.item:nth-child(2)').classList.add('active');
            }else if(scrollTop >= content3Top && scrollTop < content4Top){
                aside.querySelector('.item:nth-child(3)').classList.add('active');
            }else if(scrollTop >= content4Top){
                aside.querySelector('.item:nth-child(4)').classList.add('active');
            }
        });
    </script>
</body>
</html>
