<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例06</title>
    <style>
        .wrapper {
          min-width: 400px;
          max-width: 800px;
          display: flex;
          justify-content: flex-end;
        }
    
        .avatar {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          overflow: hidden;
          background: url(./images/avatar.jpg) no-repeat center / cover;
          margin-right: 20px;
        }
    
        .wrapper textarea {
          outline: none;
          border-color: transparent;
          resize: none;
          background: #f5f5f5;
          border-radius: 4px;
          flex: 1;
          padding: 10px;
          transition: all 0.5s;
          height: 30px;
        }
    
        .wrapper textarea:focus {
          border-color: #e4e4e4;
          background: #fff;
          height: 50px;
        }
    
        .wrapper button {
          background: #00aeec;
          color: #fff;
          border: none;
          border-radius: 4px;
          margin-left: 10px;
          width: 70px;
          cursor: pointer;
        }
    
        .wrapper .total {
          margin-right: 80px;
          color: #999;
          margin-top: 5px;
          opacity: 0;
          transition: all 0.5s;
        }
    
        .list {
          min-width: 400px;
          max-width: 800px;
          /* display: flex; */
        }
    
        .list .item {
          width: 100%;
          display: flex;
          margin-bottom: 10px;
        }
    
        .list .item .info {
          flex: 1;
          border-bottom: 1px dashed #e4e4e4;
          padding-bottom: 10px;
        }
    
        .list .item p {
          margin: 0;
        }
    
        .list .item .name {
          color: #FB7299;
          font-size: 14px;
          font-weight: bold;
        }
    
        .list .item .text {
          color: #333;
          padding: 10px 0;
        }
    
        .list .item .time {
          color: #999;
          font-size: 12px;
        }
      </style>
</head>
<body>
    <div class="wrapper">
    <i class="avatar"></i>
    <textarea id="tx" placeholder="发一条友善的评论" rows="2" maxlength="200"></textarea>
    <button>发布</button>
  </div>
  <div class="wrapper">
    <span class="total">0/200字</span>
  </div>
  <div class="list">
    <div class="item" style="display: none;">
      <i class="avatar"></i>
      <div class="info">
        <p class="name">清风徐来</p>
        <p class="text">大家都辛苦啦，感谢各位大大的努力，能圆满完成真是太好了[笑哭][支持]</p>
        <p class="time">2022-10-10 20:29:21</p>
      </div>
    </div>
  </div>

  <script>
    const total = document.querySelector('.total');
    const input = document.querySelector('#tx');
    const button = document.querySelector('button');
    const list = document.querySelector('.list');
    // 输入事件
    input.addEventListener('input', () => {
        let count = input.value.length;
        if(count > 200){
            return;
        }
        total.innerText = `${count}/200字`;
    });

    // 获取焦点
    input.addEventListener('focus', () => {
        total.style.opacity = 1;
    });
    // 失去焦点
    input.addEventListener('blur', () => {
        total.style.opacity = 0;
    });

    // 监听按钮点击
    button.addEventListener('click', () => {
        addComment();
    });

    // 监听回车键
    document.addEventListener('keydown', (e) => {
        if(e.code === 'Enter'){
            button.click();
        }
    });

    // 添加评论
    function addComment() {
        let value = input.value.trim();
        if(value.length === 0){
            return;
        }
        let time = new Date().toLocaleString();

        let str = `
            <div class="item">
                <i class="avatar"></i>
                <div class="info">
                    <p class="name">清风徐来</p>
                    <p class="text">${value}</p>
                    <p class="time">${time}</p>
                </div>
            </div>`;
        list.innerHTML += str;

        // 清空输入框
        input.value = '';
        // 失去焦点
        input.blur();
    }
  </script>
</body>
</html>
