<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时器</title>
</head>
<body>
    <script>
        // 开启定时器
        let t = setInterval(() => {
            console.log('定时器触发');
        }, 1000);
        console.log(t); // 定时器ID

        // 关闭定时器
        clearInterval(t);
    </script>
</body>
</html>
