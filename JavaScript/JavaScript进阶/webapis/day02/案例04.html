<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例04</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
        }

        .box {
            width: 600px;
            margin: 50px auto;
            display: flex;
            font-size: 25px;
            line-height: 40px;
        }

        .qs {

            width: 450px;
            height: 40px;
            color: red;

        }

        .btns {
            text-align: center;
        }

        .btns button {
            width: 120px;
            height: 35px;
            margin: 0 50px;
        }
    </style>
</head>
<body>
    <h2>随机点名</h2>
    <div class="box">
        <span>名字是：</span>
        <div class="qs">点击开始</div>
    </div>
    <div class="btns">
        <button class="start">开始</button>
        <button class="end">结束</button>
    </div>
    <script>
        const name = ['张三', '李四', '王五', '赵六', '钱七'];
        const qs = document.querySelector('.qs');
        let timer;
        let random;

        document.querySelector('.start').addEventListener('click', () => {
            if(name.length == 0){
                return;
            }
            
            timer = setInterval(() => {
                random = Math.floor(Math.random() * name.length);
                qs.innerText = name[random];
            }, 50);
        });

        document.querySelector('.end').addEventListener('click', () => {
            clearInterval(timer);

            name.splice(random, 1);
        });
    </script>
</body>
</html>
