<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例01</title>
    <link rel="stylesheet" href="css/01.css">
</head>
<body>
    <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    姓名：<input type="text" class="uname" name="uname" />
    年龄：<input type="text" class="age" name="age" />
    性别:
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    薪资：<input type="text" class="salary" name="salary" />
    就业城市：<select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">录入</button>
  </form>

  <h1>就业榜</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      
        <!-- <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr>  -->
       
    </tbody>
  </table>
  <script>
    // 学生数组
    const stud_arr = JSON.parse(localStorage.getItem('stud')) || {};
    let new_id = localStorage.getItem('new_id') || 1000;
    
    // 获取表单
    const form = document.querySelector('.info');
    // 获取表格的tbody
    const tbody = document.querySelector('tbody');

    render();
    form.addEventListener('submit', function(e){
        e.preventDefault(); // 阻止默认提交行为

        // 获取表单数据
        let id = new_id; 
        let uname = e.target.uname.value;
        let age = e.target.age.value
        let gender = e.target.gender.value;
        let salary = e.target.salary.value;
        let city = e.target.city.value;

        // 学生对象
        let stu = {
            id,
            uname,
            age,
            gender,
            salary,
            city
        };
        stud_arr[id] = stu;

        localStorage.setItem('stud', JSON.stringify(stud_arr));
        localStorage.setItem('new_id', ++new_id);
        // console.log(stud_arr);
        render();
    });

    // 绑定删除按钮
    tbody.addEventListener('click', function(e){
        if(e.target.tagName == 'A'){
            // console.dir(e.target);
            let stid = e.target.dataset.stid;
            delete stud_arr[stid];
            localStorage.setItem('stud', JSON.stringify(stud_arr));
            
            render();
        }
    });

    function render(){
        tbody.innerHTML = '';
        let arr = localStorage.getItem('stud');
        arr = JSON.parse(arr);
        if(arr){
            for(let id in arr){
                let item = arr[id];
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.id}</td>
                  <td>${item.uname}</td>
                  <td>${item.age}</td>
                  <td>${item.gender}</td>
                  <td>${item.salary}</td>
                  <td>${item.city}</td>
                  <td>
                    <a data-stid="${item.id}" href="javascript:">删除</a>
                  </td>`;
                tbody.appendChild(tr);
            }
        }
    }
  </script>
</body>
</html>
