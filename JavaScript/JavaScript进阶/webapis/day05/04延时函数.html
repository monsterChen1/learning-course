<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>延时函数</title>
</head>
<body>
    <script>
        // setTimeout(函数, 延时的时间(毫秒))
        // 1秒 = 1000毫秒
        setTimeout(function() {
            console.log('1秒到了');
        }, 1000);

        // setInterval(函数, 间隔的时间(毫秒))
        setInterval(function() {
            console.log('每隔1秒执行一次');
        }, 1000);   
    </script>
</body>
</html>
