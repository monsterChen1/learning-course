<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例03</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="box"></div>
    <script>
        const box = document.querySelector('#box');

        setTimeout(() => {
            // 5秒后隐藏div
            box.style.display = 'none';
        }, 5000);
    </script>
</body>
</html>
