<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js插件</title>
    <!-- swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.css">
    <!-- swiper JS -->
    <script src="https://unpkg.com/swiper@8/swiper-bundle.js"> </script>
    <style>
        .swiper {
            width: 600px;
            height: 400px;
        }
        img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="swiper">
        <!-- 轮播图结构 -->
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="../day02/images/slider01.jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="../day02/images/slider02.jpg" alt="">
            </div>
            <div class="swiper-slide">
                <img src="../day02/images/slider03.jpg" alt="">
            </div>
        </div>

        <!-- 分页器 -->
        <div class="swiper-pagination"></div>

        <!-- 前进后退按钮 -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- 滚动条 -->
        <!-- <div class="swiper-scrollbar"></div> -->
    </div>
    <script>
        // 插件 swiper 轮播插件
        // 案例：https://www.swiper.com.cn/download/index.html
        // 使用文档：https://www.swiper.com.cn/api/index.html
        const swiper = new Swiper('.swiper', {
            loop: true,
            autoplay: true,
            speed: 3000,
            // 分页器
            pagination: {
                el: '.swiper-pagination',
            },
            // 前进后退按钮
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            // 滚动条
            scrollbar: {
                el: '.swiper-scrollbar',
            }
        });
    </script>
</body>
</html>
