<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组方法</title>
</head>
<body>
    <script>
        // 1. 映射数组
        let num = [100, 200, 300];
        console.log(num.map(item => item * 2));

        // 2. 数组值拼接
        let ary = ['a', 'b', 'c'];
        console.log(ary.join('='));
    </script>
</body>
</html>
