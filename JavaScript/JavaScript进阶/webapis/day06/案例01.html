<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例01</title>
    <style>
        .right{
            color: green;
        }
        .wrong{
            color: red;
        }
    </style>
</head>
<body>
    <input type="text" />
    <span class="msg wrong">请输入6~16位的英文，数字，下划线或短横线</span>
    <script>
        const input = document.querySelector('input');
        const msg = document.querySelector('.msg');
        let reg = /^[a-zA-Z0-9-_]{6,16}$/;
        input.addEventListener('blur', function(e){
            let str = this.value;
            if(reg.test(str)){
                msg.innerHTML = '正确';
                msg.classList.remove('wrong');
                msg.classList.add('right');
            }else{
                msg.innerHTML = '请输入6~16位的英文，数字，下划线或短横线';
                msg.classList.remove('right');
                msg.classList.add('wrong');
            }
        });
    </script>
</body>
</html>
