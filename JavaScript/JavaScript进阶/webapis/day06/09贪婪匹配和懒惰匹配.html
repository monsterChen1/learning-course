<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪婪匹配和懒惰匹配</title>
</head>
<body>
    <script>
        // 贪婪匹配： 尽可能多的匹配多个符合规则的字符
        let str = '<a><span>strong</span></a>';

        // 贪婪匹配
        let reg1 = /<.{1,7}>/g
        console.log(str.match(reg1));
    </script>
</body>
</html>
