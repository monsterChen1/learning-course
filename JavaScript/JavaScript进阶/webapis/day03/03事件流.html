<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .outer {
            width: 300px;
            height: 300px;
            background-color: orange;
        }
        .inner {
            width: 100px;
            height: 100px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"></div>
    </div>
    <script>
        // 事件流
        let outer = document.querySelector('.outer');
        let inner = document.querySelector('.inner');

        // 捕获阶段
        // 点击内层元素时，事件会先从外层元素开始捕获
        // outer.addEventListener('click', function() {
        //     console.log('外层元素被点击了 - 捕获阶段');
        // }, true);
        // inner.addEventListener('click', function() {
        //     console.log('内层元素被点击了 - 捕获阶段');
        // }, true);

        // 冒泡阶段
        // 点击内层元素时，事件会依次向外层触发同样的事件
        outer.addEventListener('click', function() {
            console.log('外层元素被点击了 - 冒泡阶段');
        });
        // inner.addEventListener('click', function() {
        //     console.log('内层元素被点击了 - 冒泡阶段');
        // });

        // 阻止事件冒泡
        inner.addEventListener('click', function(event) {
            event.stopPropagation();
            console.log('内层元素被点击了 - 冒泡阶段');
            // console.log('阻止了事件冒泡');
        });

    </script>
</body>
</html>
