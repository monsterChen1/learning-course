<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07computed</title>
    <script src="./js/vue2.dev.js"></script>
</head>

<body>
    <div id="app">
        {{ fullName }}
    </div>
    <script>
        var vm = new Vue({
            el: '#app',
            data: {
                firstName: 'Chen',
                lastName: 'Monster',
                nickName: 'YouYou'
            },
            // 计算属性
            computed: {
                // 默认写法
                fullName: function () {
                    return `${this.firstName} ${this.lastName}(${this.nickName})`
                },
                // 完整写法
                fullName2: {
                    // getter
                    get: function () {
                        return `${this.firstName} ${this.lastName}(${this.nickName})`
                    },
                    // setter
                    set: function (newValue) {
                        const names = newValue.split(' ')
                        this.firstName = names[0]
                        this.lastName = names[1].split('(')[0]
                        this.nickName = names[1].split('(')[1].split(')')[0]
                    }
                }
            }
        });
    </script>
</body>

</html>
