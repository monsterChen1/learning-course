<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11列表渲染</title>
    <script src="./js/vue2.dev.js"></script>
</head>

<body>
    <div id="app">
        <p>数组</p>
        <ul>
            <li v-for="(item, index) in list">{{ index }}: {{ item }}</li>
        </ul>
        <p>对象</p>
        <ul>
            <li v-for="(value, key, index) in obj">{{ index }}: {{ key }}: {{ value }}</li>
        </ul>
        <p>对象数组</p>
        <ul>
            <li v-for="item in objList" :key="item.id">{{ item.name }}</li>
            <!-- JavaScript 迭代器语法 -->
            <!-- <li v-for="item of objList" :key="item.id">{{ item.name }}</li> -->
        </ul>
    </div>
    <script>
        var vm = new Vue({
            el: '#app',
            data: {
                list: ['Vue', 'React', 'Angular'],
                obj: {
                    id: 10001,
                    name: 'monster',
                    age: 18
                },
                objList: [
                    { id: 1, name: '张三' },
                    { id: 2, name: '李四' },
                    { id: 3, name: '王五' }
                ]
            }
        });
    </script>
</body>

</html>
