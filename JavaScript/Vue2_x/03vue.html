<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03vue</title>
    <script src="./js/vue2.dev.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <h2>{{ title }}</h2>
    </div>
    <script>
        // 定义数据对象，并绑定到Vue的响应系统中
        // 未提前定义的数据，无法被Vue的响应系统监测到，因此无法触发视图更新
        let data = {
            message: 'Hello'
        };
        // 创建Vue实例
        var vm = new Vue({
            el: '#app',
            data: data
        });

        // Property和方法
        // $el：Vue实例挂载的DOM元素
        // $data：Vue实例的数据对象
        console.log(vm.$data, vm.$el)

        // 数据响应
        setTimeout(() => {
            data.message = 'Hello Vue!';
            data.title = "未提前定义的Property 不会被绑定到vue的响应系统中";
        }, 2000);
    </script>
</body>

</html>
